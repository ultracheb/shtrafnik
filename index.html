<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Трыбунал</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трыбунал">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Crect x='14' y='14' width='36' height='36' rx='8' fill='%23fff'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%235f1e3a'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%235f1e3a'/%3E%3Ccircle cx='40' cy='40' r='4' fill='%231e3a5f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<style>
:root{--ui:"Onest",system-ui,sans-serif;--a:#1e3a5f;--b:#5f1e3a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);background:#111;color:#fff;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#111}
header h1{font-size:19px;font-weight:800;flex:1;letter-spacing:.3px}
.hb{position:relative;border:0;background:#fff1;color:#fff;height:36px;min-width:36px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:#777}
.dot.ok{background:#5fd486}.dot.busy{background:#E3A23B}.dot.err{background:#ff6b5a}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.half{flex:1;padding:18px 16px;display:flex;flex-direction:column;position:relative;overflow-y:auto;min-height:0}
.half.a{background:var(--a)}
.half.b{background:var(--b);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.name{font-size:14px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.score{display:flex;gap:16px;margin:8px 0 12px}
.score div{font-size:13px;opacity:.85}
.score b{display:block;font-size:30px;font-weight:800}
.pun{display:flex;gap:6px;flex-wrap:wrap}
.pun button{flex:1;min-width:22%;border:0;background:#fff2;color:#fff;border-radius:12px;padding:12px 4px;font-size:13px;cursor:pointer;line-height:1.2}
.pun button:active{transform:scale(.96)}
.pun button span{display:block;font-size:22px;margin-bottom:2px}
.pun button.dice{background:#fff;color:#111;font-weight:700}
.owe{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.owe button{border:1px solid #fff5;background:none;color:#fff;border-radius:99px;padding:6px 10px;font-size:12px;cursor:pointer}
.hint{font-size:11px;opacity:.5;margin-top:6px}
.wrap{max-width:560px;width:100%;margin:0 auto}

/* кубік */
.ov{position:absolute;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2;perspective:700px;opacity:0;transition:opacity .2s}
.ov.show{opacity:1}
.hop{animation:hop 1.9s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes hop{0%{transform:translateY(160px) scale(.6)}25%{transform:translateY(-70px) scale(1)}45%{transform:translateY(0)}60%{transform:translateY(-28px)}75%{transform:translateY(0)}85%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.cube{width:96px;height:96px;position:relative;transform-style:preserve-3d;transition:transform 1.9s cubic-bezier(.15,.75,.25,1)}
.face{position:absolute;inset:0;border-radius:18px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;border:2px solid #ddd;box-shadow:inset 0 0 18px #0002;backface-visibility:hidden;text-align:center;padding:4px}
.face small{font-size:11px;font-weight:700;margin-top:2px;line-height:1.1}
.f1{transform:translateZ(48px)}.f2{transform:rotateY(180deg) translateZ(48px)}.f3{transform:rotateY(90deg) translateZ(48px)}
.f4{transform:rotateY(-90deg) translateZ(48px)}.f5{transform:rotateX(90deg) translateZ(48px)}.f6{transform:rotateX(-90deg) translateZ(48px)}
.shadow{width:90px;height:14px;border-radius:50%;background:#0008;filter:blur(6px);margin-top:-4px}
.ov .lbl{font-size:16px;font-weight:700;min-height:22px}
.ov .lbl.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* рэдактар */
.sheet{position:fixed;inset:0;z-index:10;background:#fff;color:#222;overflow-y:auto;display:none;color-scheme:light}
.sheet input,.dlg input{background:#fff;color:#222}
.dlg{color-scheme:light}
.sheet.open{display:block}
.sheet .in{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.edh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.edh b{font-size:20px}
.pri{border:0;background:#222;color:#fff;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
.who{display:flex;gap:8px;margin-bottom:6px}
.who button{flex:1;padding:12px;border-radius:14px;border:2px solid transparent;font-size:15px;cursor:pointer;font-weight:600;background:#f2f2f2;color:#222}
.who button.sel{border-color:#222;background:#fff}
.er{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.emo{width:48px;height:48px;border-radius:14px;border:0;background:#f2f2f2;font-size:26px;cursor:pointer;flex-shrink:0}
.ef{flex:1;min-width:0}
.ef>input{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 10px;font-size:16px;font-family:inherit}
.ef label{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;margin-top:6px}
.ef label input{width:70px;border:1px solid #ddd;border-radius:8px;padding:5px 7px;font-size:14px;font-family:inherit}
.del{border:0;background:#fde8e8;color:#c0392b;width:32px;height:32px;border-radius:50%;cursor:pointer;flex-shrink:0}
.addp{display:block;width:100%;margin-top:12px;padding:12px;border:2px dashed #ccc;background:none;border-radius:14px;font-size:15px;cursor:pointer;color:#555}
.copy{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:#f2f2f2;border-radius:12px;font-size:13px;cursor:pointer;color:#555}
.edn{font-size:12px;color:#888;margin-top:14px;line-height:1.45}

/* сінхра */
.dlgov{position:fixed;inset:0;z-index:20;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}
.dlgov.open{display:flex}
.dlg{background:#fff;color:#222;border-radius:20px;padding:18px;width:100%;max-width:400px}
.dlg h2{font-size:18px;margin-bottom:12px}
.dlg label{display:block;font-size:13px;color:#666;margin:10px 0 4px}
.dlg input{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
.dlg .hint2{font-size:12px;color:#888;margin-top:10px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dlg .sec{border:0;background:#f2f2f2;color:#222;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:30;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px #0006}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:none;color:#c0392b;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1 id="title">Трыбунал</h1>
  <button class="hb" id="langBtn" type="button">УКР</button>
  <button class="hb" id="editBtn" type="button">✏️</button>
  <button class="hb" id="shareBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></button>
  <button class="hb" id="syncBtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg><i class="dot" id="syncDot"></i></button>
</header>
<main id="main"></main>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<div class="dlgov" id="syncOv">
  <form class="dlg" id="syncForm" autocomplete="off">
    <h2 data-t="syncTitle"></h2>
    <label for="sToken" data-t="token"></label><input type="password" id="sToken">
    <label for="sGist" data-t="gist"></label><input type="text" id="sGist">
    <p class="hint2" id="syncStatus"></p>
    <div class="row">
      <button class="sec" type="button" id="syncCancel" data-t="cancel"></button>
      <button class="pri" type="submit" data-t="save"></button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const now=()=>Date.now();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- мова ---------- */
const I18N={
 be:{title:'Трыбунал',me:'Уладзь',her:'Світланка',debts:'доўгаў',threwM:'укінуў',threwF:'укінула',workedM:'адпрацаваў',workedF:'адпрацавала',
   dice:'Кубік',rolling:'Кідаем...',tapHint:'тапні па доўгу, калі выканаў',done:'Выканана ✅',undo:'Адмяніць',
   pens:'Пакаранні',ready:'Гатова',ph:'Напрыклад, 20 прысяданняў',toBank:'у капілку',addPen:'＋ Дадаць пакаранне',copyTo:'Скапіяваць гэты спіс',copyMe:'Уладзю',copyHer:'Світланцы',copied:'Скапіявана ✓',
   edNote:'Эмодзі мяняецца тапам. Калі пакаранне грашовае, пастаў суму, тады яна пойдзе ў лічыльнік крон. Кубік кожнага кідае толькі яго пакаранні, і ўсе выпадаюць з аднолькавым шанцам. Старыя доўгі застаюцца такімі, як былі.',
   save:'Захаваць',cancel:'Адмена',linkCopied:'Лінк скапіяваны, адпраўляй',syncOff:'Сінхранізацыя яшчэ не наладжана',
   syncTitle:'Сінхранізацыя',token:'GitHub токен (з доступам да gist)',gist:'ID гіста (пуста = створыцца новы)',synced:'Усё сінхранізавана',syncErr:'Не атрымалася сінхранізаваць',
   share:'Падзяліцца',sync:'Сінхранізацыя',edit:'Пакаранні',joined:'Падключыліся да агульнага трыбунала',lang:'УКР'},
 uk:{title:'Трибунал',me:'Уладзь',her:'Світланка',debts:'боргів',threwM:'вкинув',threwF:'вкинула',workedM:'відпрацював',workedF:'відпрацювала',
   dice:'Кубик',rolling:'Кидаємо...',tapHint:'тапни на борг, коли виконав',done:'Виконано ✅',undo:'Скасувати',
   pens:'Покарання',ready:'Готово',ph:'Наприклад, 20 присідань',toBank:'у скарбничку',addPen:'＋ Додати покарання',copyTo:'Скопіювати цей список',copyMe:'Уладзю',copyHer:'Світланці',copied:'Скопійовано ✓',
   edNote:'Емодзі змінюється тапом. Якщо покарання грошове, постав суму, тоді вона піде в лічильник крон. Кубик кожного кидає лише його покарання, і всі випадають з однаковим шансом. Старі борги лишаються такими, як були.',
   save:'Зберегти',cancel:'Скасувати',linkCopied:'Посилання скопійовано, надсилай',syncOff:'Синхронізацію ще не налаштовано',
   syncTitle:'Синхронізація',token:'GitHub токен (з доступом до gist)',gist:'ID гіста (порожньо = створиться новий)',synced:'Усе синхронізовано',syncErr:'Не вдалося синхронізувати',
   share:'Поділитися',sync:'Синхронізація',edit:'Покарання',joined:'Підключилися до спільного трибуналу',lang:'БЕЛ'}
};
let lang=store.get('shtrafnik.lang','be');
const t=k=>I18N[lang][k]||k;

/* ---------- дадзеныя ----------
   records: пакаранні {kind:'pen',who,ic,s,kr,order} і доўгі {kind:'debt',who,ic,s,kr,t,done}
   кожны запіс мае id і updated; выдаленне = del:true (каб сінхра ведала) */
const SEED=[];
['me','her'].forEach(w=>[
  {k:'push',ic:'💪',s:'20 адцісканняў',kr:0},{k:'k20',ic:'🪙',s:'20 Kč',kr:20},{k:'k50',ic:'💰',s:'50 Kč',kr:50}
].forEach((p,i)=>SEED.push({id:w+'-'+p.k,kind:'pen',who:w,ic:p.ic,s:p.s,kr:p.kr,order:i,updated:1})));
let records=store.get('shtrafnik.records',null)||SEED;
const persist=()=>store.set('shtrafnik.records',records);
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,7);
const pens=w=>records.filter(r=>r.kind==='pen'&&r.who===w&&!r.del).sort((a,b)=>a.order-b.order);
const debts=w=>records.filter(r=>r.kind==='debt'&&r.who===w&&!r.del);
const byId=id=>records.find(r=>r.id===id);
function touch(r,ch){Object.assign(r,ch,{updated:now()});persist();schedulePush();}
function addDebt(w,penId){
  const p=byId(penId);
  const d={id:uid(),kind:'debt',who:w,ic:p.ic,s:p.s,kr:p.kr||0,t:now(),done:false,updated:now()};
  records.push(d);persist();schedulePush();render();
  toast(`${t(w)}: ${p.s} 😈`,()=>{touch(d,{del:true});render();});
}
function doneDebt(id){touch(byId(id),{done:true,doneAt:now()});render();toast(t('done'));}

/* ---------- toast ---------- */
let toastT;
function toast(m,undo){
  const el=$('toast');el.innerHTML=esc(m)+(undo?` <button type="button">${t('undo')}</button>`:'');
  if(undo)el.querySelector('button').onclick=()=>{undo();el.classList.remove('show');};
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),undo?4000:2000);
}

/* ---------- табло ---------- */
function half(w,c){
  const mine=debts(w),open=mine.filter(x=>!x.done).sort((a,b)=>b.t-a.t),f=w==='her';
  const kr=mine.filter(x=>x.done&&x.kr).reduce((a,x)=>a+x.kr,0),worked=mine.filter(x=>x.done&&!x.kr).length;
  return `<section class="half ${c}"><div class="wrap"><div class="name">${t(w)}</div>
  <div class="score"><div><b>${open.length}</b>${t('debts')}</div><div><b>${kr} Kč</b>${t(f?'threwF':'threwM')}</div><div><b>${worked}</b>${t(f?'workedF':'workedM')}</div></div>
  <div class="pun">${pens(w).map(p=>`<button onclick="addDebt('${w}','${p.id}')"><span>${esc(p.ic)}</span>${esc(p.s)}</button>`).join('')}<button class="dice" onclick="roll('${w}')"><span>🎲</span>${t('dice')}</button></div>
  <div class="owe">${open.map(x=>`<button onclick="doneDebt('${x.id}')">${esc(x.ic)} ${esc(x.s)} ✓</button>`).join('')}</div>
  ${open.length?`<div class="hint">${t('tapHint')}</div>`:''}</div></section>`;
}
let rolling=false;
function render(){
  document.documentElement.lang=lang==='uk'?'uk':'be';
  document.title=t('title');$('title').textContent=t('title');$('langBtn').textContent=t('lang');
  [['shareBtn','share'],['syncBtn','sync'],['editBtn','edit']].forEach(([id,k])=>{$(id).title=t(k);$(id).setAttribute('aria-label',t(k));});
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  if(rolling)return; // не перарысоўваць пад кубікам
  $('main').innerHTML=half('me','a')+half('her','b');
  if($('sheet').classList.contains('open'))renderEditor();
}

/* ---------- кубік ---------- */
const SHOW=[[0,0],[0,180],[0,-90],[0,90],[-90,0],[90,0]];
function roll(w){
  if(rolling)return;
  const L=pens(w);if(!L.length)return;rolling=true;
  const FACES=Array.from({length:6},(_,i)=>L[i%L.length]);
  const hf=document.querySelector('.half.'+(w==='me'?'a':'b'));
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="hop"><div class="cube">${FACES.map((p,i)=>`<div class="face f${i+1}">${esc(p.ic)}<small>${esc(p.s)}</small></div>`).join('')}</div></div><div class="shadow"></div><div class="lbl">${t('rolling')}</div>`;
  hf.scrollTop=0;hf.appendChild(ov);
  const cube=ov.querySelector('.cube'),lbl=ov.querySelector('.lbl');
  const r=n=>Math.floor(Math.random()*n);
  cube.style.transition='none';
  cube.style.transform=`rotateX(${r(360)}deg) rotateY(${r(360)}deg) rotateZ(${r(360)}deg)`;
  void cube.offsetWidth;
  requestAnimationFrame(()=>{
    ov.classList.add('show');
    // спачатку роўна выбіраем пакаранне, потым адну з яго граняў
    const pen=L[r(L.length)],opts=FACES.map((p,i)=>p===pen?i:-1).filter(i=>i>=0);
    const k=opts[r(opts.length)],[x,y]=SHOW[k];
    cube.style.transition='';
    cube.style.transform=`rotateX(${x+360*(3+r(2))}deg) rotateY(${y+360*(2+r(2))}deg) rotateZ(${360*(1+r(2))}deg)`;
    setTimeout(()=>{lbl.textContent=`${pen.s}! 😈`;lbl.classList.add('pop')},1900);
    setTimeout(()=>{rolling=false;addDebt(w,pen.id)},3200);
  });
}

/* ---------- рэдактар пакаранняў ---------- */
const EMO=['💪','🦵','🪙','💰','🧹','🍽️','🧺','💆','☕','🎁','🧘','🏃','🍫','🌹'];
let ew='me';
function renderEditor(){
  const L=pens(ew),o=ew==='me'?'her':'me';
  $('sheetIn').innerHTML=`<div class="edh"><b>${t('pens')}</b><button class="pri" onclick="closeEditor()">${t('ready')}</button></div>
  <div class="who">${['me','her'].map(k=>`<button class="${ew===k?'sel':''}" onclick="ew='${k}';renderEditor()">${k==='me'?'🙋‍♂️':'🙋‍♀️'} ${t(k)}</button>`).join('')}</div>
  ${L.map(p=>`<div class="er">
    <button class="emo" onclick="cycleEmo('${p.id}')">${esc(p.ic)}</button>
    <div class="ef"><input value="${esc(p.s)}" placeholder="${t('ph')}" oninput="touch(byId('${p.id}'),{s:this.value})">
      <label>${t('toBank')} <input type="number" inputmode="numeric" min="0" step="10" value="${p.kr||''}" placeholder="0" oninput="touch(byId('${p.id}'),{kr:+this.value||0})"> Kč</label></div>
    ${L.length>1?`<button class="del" onclick="touch(byId('${p.id}'),{del:true});renderEditor()">✕</button>`:''}
  </div>`).join('')}
  ${L.length<6?`<button class="addp" onclick="addPen()">${t('addPen')}</button>`:''}
  <button class="copy" onclick="copyPens()">${t('copyTo')} ${t(ew==='me'?'copyHer':'copyMe')}</button>
  <div class="edn">${t('edNote')}</div>`;
}
function addPen(){
  const L=pens(ew),r={id:uid(),kind:'pen',who:ew,ic:'🎁',s:'',kr:0,order:L.length?L[L.length-1].order+1:0,updated:now()};
  records.push(r);persist();renderEditor();
  const ins=$('sheetIn').querySelectorAll('.ef>input');ins[ins.length-1].focus();
}
function cycleEmo(id){const p=byId(id),k=EMO.indexOf(p.ic);touch(p,{ic:EMO[(k+1)%EMO.length]});renderEditor();}
function copyPens(){
  const o=ew==='me'?'her':'me',src=pens(ew).filter(p=>p.s.trim());
  pens(o).forEach(p=>touch(p,{del:true}));
  src.forEach((p,i)=>records.push({id:uid(),kind:'pen',who:o,ic:p.ic,s:p.s,kr:p.kr,order:i,updated:now()}));
  persist();schedulePush();toast(t('copied'));
}
function clean(w){const L=pens(w),empty=L.filter(p=>!p.s.trim());if(empty.length<L.length)empty.forEach(p=>touch(p,{del:true}));}
function closeEditor(){clean('me');clean('her');$('sheet').classList.remove('open');render();}
$('editBtn').onclick=()=>{$('sheet').classList.add('open');renderEditor();};
$('langBtn').onclick=()=>{lang=lang==='be'?'uk':'be';store.set('shtrafnik.lang',lang);render();};

/* ---------- gist sync (як у Палічцы) ---------- */
const FILE='shtrafnik.json';
let cfg=store.get('shtrafnik.sync',{token:'',gist:''});
if(!cfg.token){ for(const k of ['palichka.sync','afisha.sync','shuflyadka.sync']){ const o=store.get(k,null); if(o&&o.token){ cfg={token:o.token,gist:''}; break; } } }
let syncing=false, again=false, pushT=null;
const setDot=s=>$('syncDot').className='dot '+(s||'');
async function gh(method,path,body){
  const r=await fetch('https://api.github.com'+path,{method,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error('GitHub '+r.status); return r.json();
}
function merge(a,b){
  const m=new Map(); [...a,...b].forEach(r=>{const c=m.get(r.id); if(!c||(r.updated||0)>(c.updated||0)) m.set(r.id,r);});
  return [...m.values()];
}
const sig=list=>JSON.stringify([...list].sort((x,y)=>x.id<y.id?-1:1).map(r=>[r.id,r.updated]));
async function sync(){
  if(!cfg.token) return;
  if(syncing){ again=true; return; }
  syncing=true; setDot('busy');
  try{
    const body=()=>({files:{[FILE]:{content:JSON.stringify({records},null,1)}}});
    if(!cfg.gist){
      const g=await gh('POST','/gists',{description:'Трыбунал',public:false,...body()});
      cfg.gist=g.id; store.set('shtrafnik.sync',cfg);
    }else{
      const g=await gh('GET','/gists/'+cfg.gist);
      const raw=g.files&&g.files[FILE]&&g.files[FILE].content;
      const incoming=raw?(JSON.parse(raw).records||[]):[];
      records=merge(records,incoming); persist();
      if(!$('sheet').classList.contains('open')) render();
      if(sig(records)!==sig(incoming)) await gh('PATCH','/gists/'+cfg.gist,body());
    }
    store.set('shtrafnik.sync',cfg); setDot('ok');
  }catch(e){ console.error(e); setDot('err'); }
  syncing=false; if(again){ again=false; sync(); }
}
function schedulePush(){ if(!cfg.token) return; clearTimeout(pushT); pushT=setTimeout(sync,800); }

$('syncBtn').onclick=()=>{
  $('sToken').value=cfg.token||''; $('sGist').value=cfg.gist||'';
  $('syncStatus').textContent=!cfg.token?t('syncOff'):($('syncDot').classList.contains('err')?t('syncErr'):t('synced'));
  $('syncOv').classList.add('open');
};
$('syncCancel').onclick=()=>$('syncOv').classList.remove('open');
$('syncOv').addEventListener('click',e=>{if(e.target===$('syncOv'))$('syncOv').classList.remove('open');});
$('syncForm').addEventListener('submit',e=>{
  e.preventDefault(); cfg={token:$('sToken').value.trim(),gist:$('sGist').value.trim()};
  store.set('shtrafnik.sync',cfg); $('syncOv').classList.remove('open'); sync();
});
$('shareBtn').onclick=async()=>{
  if(!cfg.token){ toast(t('syncOff')); $('syncBtn').click(); return; }
  if(!cfg.gist) await sync();
  if(!cfg.gist){ toast(t('syncErr')); return; }
  const link=location.origin+location.pathname+'#sync='+encodeURIComponent(btoa(JSON.stringify(cfg)));
  try{ if(navigator.share&&matchMedia('(pointer:coarse)').matches){ await navigator.share({title:t('title'),url:link}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(link); toast(t('linkCopied')); }catch(e){ prompt('',link); }
};

/* ---------- boot ---------- */
(function boot(){
  const hm=location.hash.match(/sync=([^&]+)/);
  if(hm){ try{ const c=JSON.parse(atob(decodeURIComponent(hm[1]))); if(c.token&&c.gist){ cfg=c; store.set('shtrafnik.sync',cfg); setTimeout(()=>toast(t('joined')),300); } }catch(e){}
    history.replaceState(null,'',location.pathname+location.search); }
  render(); sync();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync(); });
})();
</script>
